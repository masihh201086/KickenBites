<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#e65c00">
<link rel="manifest" href="manifest.json">
<title>Kicken Bites</title>
<style>
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#fff8f0;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  h1{font-size:1.6rem;font-weight:800;margin-bottom:4px;color:#1a1a1a;}
  p{color:#666;font-size:.9rem;margin-bottom:28px;}
  a.btn{display:block;width:100%;max-width:340px;padding:15px;border-radius:14px;
    text-decoration:none;font-size:1rem;font-weight:700;text-align:center;margin-bottom:12px;}
  .c{background:linear-gradient(135deg,#e65c00,#ff8c42);color:white;box-shadow:0 4px 14px rgba(230,92,0,.3);}
  .a{background:#1a1a2e;color:white;}
</style>
</head>
<body>
<img src="logo.webp" decoding="async" onerror="this.onerror=null;this.src='logo.png'" style="width:110px;height:110px;object-fit:contain;margin-bottom:8px" alt="Kicken Bites">
<h1>Kicken Bites</h1>
<p style="font-style:italic;color:#888;font-size:.8rem">Thunder ⚡ For Hunger</p>
<a class="btn c" href="customer.html">🛒 Order Now</a>
<!-- B-5: admin + delivery links chhupe hain; seedhe URL se access karein -->
<!-- admin: admin.html | delivery: delivery.html -->
<script>if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    // If an updated SW is found, activate it right away.
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      if(nw) nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){ nw.postMessage && nw.postMessage({type:'SKIP_WAITING'}); }
      });
    });
    setInterval(function(){ reg.update(); }, 60000); // check for a new version every minute
  }).catch(function(){});
  // When the new SW tells us it updated, reload ONCE to pick up fresh files.
  var _kbReloaded=false;
  navigator.serviceWorker.addEventListener('message', function(e){
    if(e.data && e.data.type==='SW_UPDATED' && !_kbReloaded){ _kbReloaded=true; location.reload(); }
  });
  // Also reload when control passes to a brand-new SW.
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!_kbReloaded){ _kbReloaded=true; location.reload(); }
  });
}</script>
</body>
</html>
